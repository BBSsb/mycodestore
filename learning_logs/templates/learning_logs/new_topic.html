{% extends 'learning_logs/base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h2 class="h4 mb-0">➕ Add a New Topic</h2>
            </div>
            <div class="card-body">
                <form action="{% url 'learning_logs:new_topic'%}" method="post">
                    {% csrf_token %}
                    {% load django_bootstrap5 %}
                    {% bootstrap_form form %}
                    {% bootstrap_button button_type="submit" content="Add Topic" button_class="btn-primary" %}
                </form>
                <div class="mt-3">
                    <a href="{% url 'learning_logs:topics' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
