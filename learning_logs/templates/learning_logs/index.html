{% extends 'learning_logs/base.html' %}
{% block content %}
<div class="p-5 mb-4 bg-light rounded-3">
    <div class="container-fluid py-5">
        <h1 class="display-5 fw-bold">📖 Welcome to Learning Log</h1>
        <p class="col-md-8 fs-4 mt-3">学习日志可以帮助你记录学习中的笔记和心得。</p>
        <p class="fs-5">随时随地记录你的学习进度，整理知识体系。</p>
        {% if not user.is_authenticated %}
        <div class="mt-4">
            <a href="{% url 'accounts:register' %}" class="btn btn-primary btn-lg me-2">Get Started</a>
            <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary btn-lg">Login</a>
        </div>
        {% else %}
        <div class="mt-4">
            <a href="{% url 'learning_logs:topics' %}" class="btn btn-primary btn-lg">View Your Topics</a>
        </div>
        {% endif %}
    </div>
</div>
{% endblock content %}
